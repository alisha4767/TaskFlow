<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />

    <!-- The favicon — the small icon shown in the browser tab -->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />

    <!-- Viewport meta tag: makes the site work correctly on mobile screens.
         width=device-width → use the device's actual screen width
         initial-scale=1.0 → don't zoom in/out on load -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- SEO: Title shown in browser tab and search results -->
    <title>TaskFlow — Modern Project Management</title>

    <!-- SEO: Description shown in Google search results -->
    <meta
      name="description"
      content="TaskFlow is a modern project management dashboard for tracking tasks, projects, and team productivity."
    />
  </head>
  <body>
    <!-- This single <div id="root"> is where React MOUNTS the entire app.
         React will inject all of your components inside this element.
         Without this div, React has nowhere to render. -->
    <div id="root"></div>

    <!-- This script tag loads our React application.
         type="module" enables modern JavaScript module syntax (import/export).
         Vite processes src/main.jsx and injects it here. -->
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
